<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Bem-Estar - Detalhes do tutor</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="container">
    <h1>Pet Bem-Estar</h1>
    <p class="subtitulo">Detalhes do cliente</p>

    <section>
        <h2 th:text="${tutor.nome}">Nome do tutor</h2>
        <p><strong>Telefone:</strong> <span th:text="${tutor.telefone}"></span></p>
    </section>

    <section>
        <h2>Animais cadastrados</h2>

        <div class="vazio" th:if="${#lists.isEmpty(animais)}">
            Este cliente ainda não possui animais cadastrados.
        </div>

        <table th:if="${not #lists.isEmpty(animais)}">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Espécie</th>
                    <th>Porte</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="animal : ${animais}">
                    <td th:text="${animal.nome}"></td>
                    <td th:text="${animal.especie}"></td>
                    <td th:text="${animal.porte}"></td>
                </tr>
            </tbody>
        </table>
    </section>

    <div class="botoes-formulario">
        <a th:href="@{/paginas/tutores}" class="btn btn-secundario">Voltar para tutores</a>
        <a th:href="@{/paginas/animais/novo}" class="btn btn-principal">Cadastrar animal</a>
    </div>
</main>
</body>
</html>
